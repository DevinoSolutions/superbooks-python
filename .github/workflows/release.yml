# Publishes to PyPI via OIDC trusted publishing.
#
# The PyPI project `superbooks` is configured to trust:
#   repository: DevinoSolutions/superbooks-python
#   workflow:   release.yml     <- this file's name; renaming it breaks publishing
#
# No API token is stored anywhere: `id-token: write` lets GitHub mint a
# short-lived OIDC credential that PyPI verifies against the config above.
#
# Tags are the ONLY trigger. There is deliberately no workflow_dispatch: a
# manual run carries github.ref = refs/heads/main, which has no tag to check
# the package version against, so the guard below could not protect it.
# Publishing is gated on three independent things:
#   1. the full test suite (ruff, mypy, pytest, codegen freshness)
#   2. the tag matching the version in pyproject.toml
#   3. a human approving the `pypi` GitHub environment
#
# Third-party actions are pinned to full commit SHAs. A tag like `v4` is a
# moving pointer its owner can repoint at any commit; a SHA cannot be changed
# under us. That matters most for the publish job, which holds id-token.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test before publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generated code is in sync with the manifest
        run: python scripts/codegen.py --check

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Unconditional on purpose. If this workflow is ever given a non-tag
      # trigger again, this fails closed instead of being silently skipped.
      - name: Verify the tag matches the package version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Refusing to build a release from a non-tag ref (${GITHUB_REF})." >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $VERSION."

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*

      # The last gate before anything can reach PyPI, and the reason it runs
      # here rather than only in CI: this scans the exact artifacts that get
      # uploaded. A PyPI release cannot be unpublished, so a leak that lands
      # here is permanent.
      - name: Leak scan (source + built artifacts)
        run: python scripts/leak_scan.py --require-dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    # Configured on GitHub with required reviewers, so a tag alone cannot ship
    # a release without a human approving it — see RELEASING.md.
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
